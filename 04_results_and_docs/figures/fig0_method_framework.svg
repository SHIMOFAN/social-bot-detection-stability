<text x="232" y="582" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1B3B6F">① 分类主损失：多子包加权 BCE</text>
<text x="232" y="603" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">扩大两类决策间隔 δᵢ → 提升排序精度 AP</text>
<text x="430" y="594" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E293B">+</text>
