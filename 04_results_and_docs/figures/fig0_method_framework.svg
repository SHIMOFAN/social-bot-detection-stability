<text x="700" y="91" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">标准化特征向量 uᵢ ∈ ℝ³⁹²</text>
