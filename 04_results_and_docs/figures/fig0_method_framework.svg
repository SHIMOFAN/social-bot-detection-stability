<text x="627" y="603" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="11" font-weight="600" fill="#C0392B">聚焦边界压低采样方差 σᵢ² → 收紧 Churn 上界</text>
