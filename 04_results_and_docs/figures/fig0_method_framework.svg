<text x="162" y="192" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569">fp16 隐藏层缓存（零重复算力）</text>
