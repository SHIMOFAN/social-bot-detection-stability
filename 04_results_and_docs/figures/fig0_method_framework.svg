<text x="292" y="91" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">单条截断 128 tokens ｜ 全程不使用社交关系图</text>
<rect x="585" y="50" width="230" height="50" rx="8" fill="#EAF6F5" stroke="#217A78" stroke-width="1.5"/>
