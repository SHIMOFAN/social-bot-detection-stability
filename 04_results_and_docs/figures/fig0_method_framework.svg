<text x="700" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="11" font-weight="400" fill="#CCFBF1">输出静态表征 pᵢ ∈ ℝ⁶⁴</text>
