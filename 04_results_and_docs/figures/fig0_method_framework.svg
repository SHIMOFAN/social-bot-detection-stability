<rect width="860" height="660" fill="#FFFFFF" rx="10"/>
<text x="430.0" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, SimHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3B6F">K=4 局部解冻 + 多头集成 (MH5) + 多子包概率方差 (SubBag-ProbVar) 框架</text>
<rect x="45" y="50" width="495" height="50" rx="8" fill="#EBF1F8" stroke="#1B3B6F" stroke-width="1.5"/>
